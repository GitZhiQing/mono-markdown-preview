name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check tag matches package version
        run: |
          node -e "const p=require('./package.json'); const tag=process.env.GITHUB_REF_NAME.replace(/^v/, ''); if (p.version !== tag) { console.error('Tag v' + tag + ' does not match package version ' + p.version); process.exit(1); }"

      - name: Test
        run: npm test

      - name: Package VSIX
        run: npm run package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mono-markdown-preview-vsix
          path: "*.vsix"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
          generate_release_notes: true
