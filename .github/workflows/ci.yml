name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test
        run: npm test

      - name: Package VSIX
        if: matrix.os == 'ubuntu-latest'
        run: npm run package

      - name: Verify VSIX
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          ls -lh *.vsix
          echo "### VSIX" >> "$GITHUB_STEP_SUMMARY"
          ls -lh *.vsix >> "$GITHUB_STEP_SUMMARY"

      - name: Upload VSIX
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: mono-markdown-preview-vsix
          path: "*.vsix"
          retention-days: 14
